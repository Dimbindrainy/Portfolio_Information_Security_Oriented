<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zo Portfolio</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Sci-Fi Theme -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            space: '#050816',
            neonBlue: '#00f0ff',
            neonSoft: '#0ea5e9',
            cardDark: '#0b1120'
          },
          boxShadow: {
            neon: "0 0 10px #00f0ff, 0 0 20px #00f0ff",
            neonSoft: "0 0 5px #0ea5e9"
          },
          animation: {
          'spin-slow': 'spin 8s linear infinite',
          'scan': 'scan 3s linear infinite',
          'fade-left': 'fadeLeft 1s ease-out forwards',
          'fade-right': 'fadeRight 1s ease-out forwards'
          },
          keyframes: {
            scan: {
              '0%': { top: '-20%' },
              '100%': { top: '120%' }
            }
          },
          keyframes: {
            fadeLeft: {
              '0%': { opacity: 0, transform: 'translateX(-80px)' },
              '100%': { opacity: 1, transform: 'translateX(0)' }
            },
            fadeRight: {
              '0%': { opacity: 0, transform: 'translateX(80px)' },
              '100%': { opacity: 1, transform: 'translateX(0)' }
            }
          }
        }
      }
    }
  </script>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

</head>

<body class="bg-space text-gray-200 font-sans">

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// ================= API =================
const fetchProjects = async (token = null) => {
  try {
    const res = await fetch("http://127.0.0.1:5000/projects/", {
      headers: token ? { "Authorization": `Bearer ${token}` } : {}
    });
    return await res.json();
  } catch (error) {
    console.error(error);
    return [];
  }
};

const fetchSkills = async () => {
  try {
    const res = await fetch("http://127.0.0.1:5000/skills");
    return await res.json();
  } catch (error) {
    console.error(error);
    return { skills: [], tech_stack: [], tools: [] };
  }
};

const fetchAbout = async () => {
  try {
    const res = await fetch("http://127.0.0.1:5000/about/");
    return await res.json();
  } catch (error) {
    console.error(error);
    return null;
  }
};

const loginAdmin = async (username, password) => {
  try {
    const res = await fetch("http://127.0.0.1:5000/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    console.log("Login response:", res.status, data);  // ← ADD THIS
    if (res.status === 200 && data.token) return data.token;
    return null;
  } catch (error) {
    console.error(error);
    return null;
  }
};

// ================= COMPONENTS =================
const SkillBadge = ({ text }) => (
  <span className="px-4 py-2 rounded-full border border-neonBlue text-neonBlue shadow-neonSoft text-sm">
    {text}
  </span>
);

const ProjectCard = ({ name, description }) => (
  <div className="bg-cardDark border border-neonBlue/30 p-6 rounded-lg shadow-lg hover:shadow-neon transition">
    <h3 className="text-xl font-bold text-neonBlue">{name}</h3>
    <p className="mt-2 text-gray-300">{description}</p>
  </div>
);
const TypingEffect = () => {
  const [text, setText] = React.useState("");
  const [roleIndex, setRoleIndex] = React.useState(0);
  const [charIndex, setCharIndex] = React.useState(0);

  const roles = [
    "Cybersecurity Architect",
    "Cloud Infrastructure Engineer",
    "Secure Web Developer",
    "Embedded Systems Builder"
  ];


  React.useEffect(() => {
    const currentRole = roles[roleIndex];
    if (charIndex < currentRole.length) {
      const timeout = setTimeout(() => {
        setText(currentRole.substring(0, charIndex + 1));
        setCharIndex(charIndex + 1);
      }, 60);
      return () => clearTimeout(timeout);
    } else {
      setTimeout(() => {
        setCharIndex(0);
        setRoleIndex((roleIndex + 1) % roles.length);
      }, 1500);
    }
  }, [charIndex, roleIndex]);

  return <span>{text}_</span>;
};
const Stat = ({ number, label }) => (
  <div>
    <p className="text-3xl font-bold text-neonBlue">{number}</p>
    <p className="text-gray-400 text-sm">{label}</p>
  </div>
);
const Status = ({ label, value, color }) => (
  <div className="flex justify-between border-b border-neonBlue/10 py-2">
    <span className="text-gray-400">{label}</span>
    <span className={color}>{value}</span>
  </div>
);
const AdminDashboard = ({ token, onLogout }) => {
  const [skillsData, setSkillsData] = React.useState({ skills: [], tech_stack: [], tools: [] });
  const [aboutData, setAboutData] = React.useState({ headline: "", paragraphs: [], roles: [] });

  const [newSkill, setNewSkill] = React.useState({ category: "", name: "" });
  const [newTech, setNewTech] = React.useState("");
  const [newTool, setNewTool] = React.useState("");
  const [newParagraph, setNewParagraph] = React.useState("");
  const [newRole, setNewRole] = React.useState("");

  React.useEffect(() => {
    fetch("http://127.0.0.1:5000/skills", {
      headers: { Authorization: `Bearer ${token}` }
    })
      .then(res => res.json())
      .then(data => setSkillsData(data));

    fetch("http://127.0.0.1:5000/about/", {
      headers: { Authorization: `Bearer ${token}` }
    })
      .then(res => res.json())
      .then(data => setAboutData(data));
  }, [token]);

  const saveAbout = () => {
    fetch("http://127.0.0.1:5000/about/", {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token}`
      },
      body: JSON.stringify(aboutData)
    });
  };

  const addParagraph = () => {
    if (newParagraph.trim()) {
      setAboutData({ ...aboutData, paragraphs: [...aboutData.paragraphs, newParagraph] });
      setNewParagraph("");
    }
  };
  const addSkill = async () => {
    if (!newSkill.category || !newSkill.name) return;
    const res = await fetch("http://127.0.0.1:5000/skills", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token}`
      },
      body: JSON.stringify({ category: "skills", value: { ...newSkill } })
    });
    const data = await res.json();
    setSkillsData(data);
    setNewSkill({ category: "", name: "" });
  };

  const addTech = async () => {
    if (!newTech) return;
    const res = await fetch("http://127.0.0.1:5000/skills", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token}`
      },
      body: JSON.stringify({ category: "tech_stack", value: newTech })
    });
    const data = await res.json();
    setSkillsData(data);
    setNewTech("");
  };

  const addTool = async () => {
    if (!newTool) return;
    const res = await fetch("http://127.0.0.1:5000/skills", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token}`
      },
      body: JSON.stringify({ category: "tools", value: newTool })
    });
    const data = await res.json();
    setSkillsData(data);
    setNewTool("");
  };


  const removeParagraph = index => {
    setAboutData({
      ...aboutData,
      paragraphs: aboutData.paragraphs.filter((_, i) => i !== index)
    });
  };
  const removeSkill = async (index) => {
    const res = await fetch("http://127.0.0.1:5000/skills", {
      method: "DELETE",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token}`
      },
      body: JSON.stringify({ category: "skills", index })
    });
    const data = await res.json();
    setSkillsData(data);
  };

  const removeTech = async (index) => {
    const res = await fetch("http://127.0.0.1:5000/skills", {
      method: "DELETE",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token}`
      },
      body: JSON.stringify({ category: "tech_stack", index })
    });
    const data = await res.json();
    setSkillsData(data);
  };

  const removeTool = async (index) => {
    const res = await fetch("http://127.0.0.1:5000/skills", {
      method: "DELETE",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token}`
      },
      body: JSON.stringify({ category: "tools", index })
    });
    const data = await res.json();
    setSkillsData(data);
  };

  const addRole = () => {
    if (newRole.trim()) {
      setAboutData({ ...aboutData, roles: [...aboutData.roles, newRole] });
      setNewRole("");
    }
  };

  const removeRole = index => {
    setAboutData({ ...aboutData, roles: aboutData.roles.filter((_, i) => i !== index) });
  };

  return (
    <div className="min-h-screen bg-space text-gray-200 p-8">
      <div className="flex justify-between items-center mb-8">
        <h1 className="text-4xl font-bold text-neonBlue">Admin Dashboard</h1>
        <button onClick={onLogout} className="px-4 py-2 bg-red-600 rounded hover:shadow-neon transition">Logout</button>
      </div>

      {/* About Section */}
      <section className="mb-12">
        <h2 className="text-2xl font-bold text-neonBlue mb-4">About</h2>
        <div className="mb-4">
          <input
            placeholder="Headline"
            value={aboutData.headline}
            onChange={e => setAboutData({ ...aboutData, headline: e.target.value })}
            className="p-2 rounded bg-black border border-neonBlue text-gray-200 w-full"
          />
        </div>

        <div className="mb-4">
          <h3 className="text-neonBlue font-semibold mb-2">Paragraphs</h3>
          {aboutData.paragraphs.map((p, i) => (
            <div key={i} className="flex items-center mb-2">
              <p className="flex-1 text-gray-200">{p}</p>
              <button onClick={() => removeParagraph(i)} className="ml-2 text-red-500 font-bold">X</button>
            </div>
          ))}
          <div className="flex gap-2 mt-2">
            <input
              placeholder="New Paragraph"
              value={newParagraph}
              onChange={e => setNewParagraph(e.target.value)}
              className="p-2 rounded bg-black border border-neonBlue text-gray-200 flex-1"
            />
            <button onClick={addParagraph} className="px-4 py-2 bg-neonBlue text-black rounded hover:shadow-neon transition">Add</button>
          </div>
        </div>

        <div className="mb-4">
          <h3 className="text-neonBlue font-semibold mb-2">Roles</h3>
          {aboutData.roles.map((r, i) => (
            <div key={i} className="flex items-center mb-2">
              <p className="flex-1 text-gray-200">{r}</p>
              <button onClick={() => removeRole(i)} className="ml-2 text-red-500 font-bold">X</button>
            </div>
          ))}
          <div className="flex gap-2 mt-2">
            <input
              placeholder="New Role"
              value={newRole}
              onChange={e => setNewRole(e.target.value)}
              className="p-2 rounded bg-black border border-neonBlue text-gray-200 flex-1"
            />
            <button onClick={addRole} className="px-4 py-2 bg-neonBlue text-black rounded hover:shadow-neon transition">Add</button>
          </div>
        </div>

        <button onClick={saveAbout} className="px-6 py-2 bg-green-500 text-black font-bold rounded hover:shadow-neon transition mt-4">
          Save About
        </button>
      </section>

      <section className="mb-12">
        <h2 className="text-2xl font-bold text-neonBlue mb-4">Skills</h2>
        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mb-4">
          {skillsData.skills.map((s, i) => (
            <div key={i} className="p-2 rounded border border-neonBlue shadow-neon flex justify-between items-center">
              <div>
                <p className="text-sm text-gray-400">{s.category}</p>
                <p className="text-neonBlue font-bold">{s.name}</p>
              </div>
              <button onClick={() => removeSkill(i)} className="text-red-500 font-bold px-2 hover:text-red-400">X</button>
            </div>
          ))}
        </div>
        <div className="flex gap-2 mb-6">
          <input
            placeholder="Category"
            value={newSkill.category}
            onChange={e => setNewSkill({...newSkill, category: e.target.value})}
            className="p-2 rounded bg-black border border-neonBlue text-gray-200"
          />
          <input
            placeholder="Skill Name"
            value={newSkill.name}
            onChange={e => setNewSkill({...newSkill, name: e.target.value})}
            className="p-2 rounded bg-black border border-neonBlue text-gray-200 flex-1"
          />
          <button onClick={addSkill} className="px-4 py-2 bg-neonBlue text-black rounded hover:shadow-neon transition">Add</button>
        </div>
      </section>

      {/* ---------------- TECH STACK ---------------- */}
      <section className="mb-12">
        <h2 className="text-2xl font-bold text-neonBlue mb-4">Tech Stack</h2>
        <div className="flex flex-wrap gap-4 mb-4">
          {skillsData.tech_stack.map((t, i) => (
            <span key={i} className="px-4 py-2 border border-neonBlue rounded-full shadow-neon text-neonBlue flex items-center gap-2">
              {t} <button onClick={() => removeTech(i)} className="text-red-500 font-bold hover:text-red-400">X</button>
            </span>
          ))}
        </div>
        <div className="flex gap-2">
          <input
            placeholder="Add Tech"
            value={newTech}
            onChange={e => setNewTech(e.target.value)}
            className="p-2 rounded bg-black border border-neonBlue text-gray-200 flex-1"
          />
          <button onClick={addTech} className="px-4 py-2 bg-neonBlue text-black rounded hover:shadow-neon transition">Add</button>
        </div>
      </section>

      {/* ---------------- TOOLS ---------------- */}
      <section className="mb-12">
        <h2 className="text-2xl font-bold text-neonBlue mb-4">Tools</h2>
        <div className="flex flex-wrap gap-4 mb-4">
          {skillsData.tools.map((t, i) => (
            <span key={i} className="px-4 py-2 border border-neonBlue rounded-full shadow-neon text-neonBlue flex items-center gap-2">
              {t} <button onClick={() => removeTool(i)} className="text-red-500 font-bold hover:text-red-400">X</button>
            </span>
          ))}
        </div>
        <div className="flex gap-2">
          <input
            placeholder="Add Tool"
            value={newTool}
            onChange={e => setNewTool(e.target.value)}
            className="p-2 rounded bg-black border border-neonBlue text-gray-200 flex-1"
          />
          <button onClick={addTool} className="px-4 py-2 bg-neonBlue text-black rounded hover:shadow-neon transition">Add</button>
        </div>
      </section>
    </div>
  );
};
// ================= MAIN APP =================
const App = () => {
  const [projects, setProjects] = useState([]);
  const [token, setToken] = useState(localStorage.getItem("token"));
  const [showLogin, setShowLogin] = useState(false);
  const [loginForm, setLoginForm] = useState({ username: "", password: "" });
  const [loginError, setLoginError] = useState("");
  const [page, setPage] = useState("home"); // new state
  
  const [skillsData, setSkillsData] = useState({
    skills: [],
    tech_stack: [],
    tools: []
  });
  
  const [aboutData, setAboutData] = useState(null);

  useEffect(() => {
    fetchProjects(token).then(data => setProjects(data));
  }, [token]);

  const handleLogin = async (e) => {
    e.preventDefault();
    const t = await loginAdmin(loginForm.username, loginForm.password);
    if (t) {
      setToken(t);
      setShowLogin(false);
      setLoginError("");
      setPage("dashboard"); // ← redirect to dashboard
    } else {
      setLoginError("Invalid credentials");
    }
  };

  const handleLogout = () => {
    setToken(null);
    setPage("home");
  };

  const scrollToSection = (id) => {
    document.getElementById(id).scrollIntoView({ behavior: "smooth" });
  };

  
  

  useEffect(() => {
    fetchSkills().then(data => setSkillsData(data));
  }, []);


  useEffect(() => {
    fetchAbout().then(data => setAboutData(data));
  }, []);

  return (

    <div>
      {page === "dashboard" && token ? (
        <AdminDashboard token={token} onLogout={handleLogout} />
      ) : (

          <div>

            {/* NAVBAR */}
            <nav className="fixed w-full bg-black/40 backdrop-blur-md border-b border-neonBlue/20 z-50">
              <div className="max-w-6xl mx-auto px-8 py-4 flex justify-between items-center">
                <div className="font-bold text-neonBlue tracking-widest">PORTFOLIO ZO</div>
                <div className="space-x-6 hidden md:block">
                  {["home","about","skills","tech","tools","projects"].map(item => (
                    <button key={item}
                      onClick={() => scrollToSection(item)}
                      className="hover:text-neonBlue transition">
                      {item.toUpperCase()}
                    </button>
                  ))}
                  {token && (
                    <button
                      onClick={() => {
                        localStorage.removeItem("token");
                        setToken(null);
                      }}
                      className="ml-6 text-red-400 hover:text-red-300 transition"
                    >
                      LOGOUT
                    </button>
                  )}

                </div>
              </div>
            </nav>

            {/* SECRET ADMIN BUTTON */}
          
            <button
              onClick={() => setShowLogin(true)}
              className="fixed bottom-16 right-6 z-50 text-xs text-gray-600 hover:text-neonBlue">
              ●
            </button>


            {/* LOGIN MODAL */}
            {showLogin && (
              <div className="fixed inset-0 bg-black/70 flex items-center justify-center">
                <form onSubmit={handleLogin}
                  className="bg-cardDark border border-neonBlue/40 p-8 rounded-lg shadow-neon w-96">
                  <h2 className="text-xl font-bold text-neonBlue mb-4 text-center">
                    Admin Access
                  </h2>
                  {loginError && <p className="text-red-500 mb-4">{loginError}</p>}
                  <input
                    type="text"
                    placeholder="Username"
                    className="w-full p-2 mb-4 bg-black border border-neonBlue/40 rounded"
                    value={loginForm.username}
                    onChange={e => setLoginForm({...loginForm, username:e.target.value})}
                    required
                  />
                  <input
                    type="password"
                    placeholder="Password"
                    className="w-full p-2 mb-4 bg-black border border-neonBlue/40 rounded"
                    value={loginForm.password}
                    onChange={e => setLoginForm({...loginForm, password:e.target.value})}
                    required
                  />
                  <button className="w-full py-2 bg-neonBlue text-black font-bold rounded hover:shadow-neon transition">
                    LOGIN
                  </button>
                </form>
              </div>
            )}

            <div className="pt-28">

              {/* HERO */}
              <section id="home" className="relative min-h-screen flex items-center justify-center overflow-hidden">

                {/* Animated Grid Background */}
                <div className="absolute inset-0 bg-[linear-gradient(rgba(0,240,255,0.05)_1px,transparent_1px),linear-gradient(90deg,rgba(0,240,255,0.05)_1px,transparent_1px)] bg-[size:40px_40px] animate-pulse"></div>

                <div className="relative z-10 max-w-7xl mx-auto px-8 grid md:grid-cols-2 gap-16 items-center">

                  {/* LEFT SIDE */}
                  <div>
                    <h1 className="text-5xl md:text-6xl font-extrabold text-neonBlue drop-shadow-lg">
                      Nomenjanahary Zo DIMBINDRAINY
                    </h1>

                    <div className="mt-6 text-xl font-mono text-green-400">
                      &gt; <TypingEffect />
                    </div>

                    <div className="mt-8 flex gap-4">
                      <button
                        onClick={() => document.getElementById("projects").scrollIntoView({behavior:"smooth"})}
                        className="px-6 py-3 bg-neonBlue text-black font-bold rounded hover:shadow-neon transition">
                        View Projects
                      </button>

                      <button className="px-6 py-3 border border-neonBlue text-neonBlue rounded hover:shadow-neonSoft transition">
                        Download CV
                      </button>
                    </div>

                    {/* Stats */}
                    <div className="mt-14 grid grid-cols-2 gap-6">
                      <Stat number="10+" label="Secure Deployments" />
                      <Stat number="5+" label="Cloud Architectures" />
                      <Stat number="15+" label="Automation Scripts" />
                      <Stat number="3+" label="Embedded Systems" />
                    </div>
                  </div>

                  {/* RIGHT SIDE - SOC PANEL */}
                  {/* HOLOGRAM PROFILE */}
                  <div className="flex flex-col items-center mb-8 relative">

                    <div className="relative w-48 h-48">

                      {/* Rotating outer ring */}
                      <div className="absolute inset-0 rounded-full border-4 border-neonBlue animate-spin-slow opacity-60"></div>

                      {/* Glow ring */}
                      <div className="absolute inset-2 rounded-full border-2 border-neonBlue shadow-neon"></div>

                      {/* Scanning line */}
                      <div className="absolute inset-0 rounded-full overflow-hidden">
                        <div className="absolute w-full h-8 bg-gradient-to-b from-transparent via-neonBlue/40 to-transparent animate-scan"></div>
                      </div>

                      {/* Profile Image */}
                      <img
                        src="assets/Profilee.png"
                        className="w-48 h-48 rounded-full object-cover border-4 border-neonBlue shadow-neon relative z-10"
                      />
                    </div>

                    <p className="mt-4 text-2xl text-neonBlue font-bold tracking-widest">
                      OPERATOR: ZO
                    </p>
                    <p className="text-sm text-green-400">IDENTITY VERIFIED</p>

                  </div>


                </div>
              </section>


              {/* ABOUT */}
              {aboutData && (
              <section id="about" className="py-28 text-center max-w-5xl mx-auto px-8">

                <h2 className="text-3xl font-bold text-neonBlue mb-10">
                  About Me
                </h2>

                <h3 className="text-xl text-green-400 mb-8">
                  {aboutData.headline}
                </h3>

                <div className="space-y-6 text-gray-300 leading-relaxed text-lg">
                  {aboutData.paragraphs.map((p, i) => (
                    <p key={i}>{p}</p>
                  ))}
                </div>

                {/* Roles */}
                <div className="flex justify-center mt-10 text-xl font-mono text-green-400">
                  &gt; <TypingEffect roles={aboutData.roles} />
                </div>

                {/* Stats */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-8 mt-16">
                  {aboutData.stats.map((stat, i) => (
                    <Stat key={i} number={stat.number} label={stat.label} />
                  ))}
                </div>

              </section>
              )}


              {/* SKILLS */}
              {/* CORE SKILLS */}
              <section id="skills" className="py-24">
                <h2 className="text-3xl font-bold text-center text-neonBlue mb-16">
                  Core Skills
                </h2>

                <div className="max-w-6xl mx-auto px-8 grid md:grid-cols-2 gap-8">
                  {skillsData.skills.map((skill, i) => (
                    <div
                      key={i}
                      className="bg-cardDark border border-neonBlue/30 p-6 rounded-lg shadow-neonSoft hover:shadow-neon transition duration-300"
                    >
                      <p className="text-neonBlue font-semibold text-lg">
                        {skill.name}
                      </p>
                      <p className="text-xs text-gray-400 mt-1">
                        {skill.category}
                      </p>
                    </div>
                  ))}
                </div>
              </section>

              {/* TECH STACK */}
              <section id="tech" className="py-24 bg-black/20">
                <h2 className="text-3xl font-bold text-center text-neonBlue mb-16">
                  Tech Stack
                </h2>

                <div className="max-w-5xl mx-auto px-8 flex flex-wrap justify-center gap-6">
